# Overpass, the app. Generate the Xcode project with `xcodegen`.
#
# Everything that can be decided without a window lives in the Swift package at
# the repository root (IOptronKit, SkyKit) and is tested with `swift test`. This
# target is only the SwiftUI layer. It is an Xcode target, not a SwiftPM
# executable as in notebookMLX, because iOS needs a real app bundle.
name: Overpass
options:
  bundleIdPrefix: com.djsincla
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  OverpassKit:
    path: .

settings:
  base:
    DEVELOPMENT_TEAM: HG979YFABK
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Overpass:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: OverpassKit
        product: SkyKit
      - package: OverpassKit
        product: IOptronKit
    entitlements:
      path: App/Overpass.entitlements
      properties:
        # Mac only; iOS ignores these. Sandboxed so it can go through the Mac App Store.
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.personal-information.location: true
        # The mount's USB serial port.
        com.apple.security.device.serial: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Overpass
        LSApplicationCategoryType: public.app-category.utilities
        NSLocationWhenInUseUsageDescription: >-
          Overpass uses your location to work out where satellites, the Sun, Moon
          and planets appear in your sky.
        NSLocalNetworkUsageDescription: >-
          Overpass connects to your mount, or to a relay plugged into it, on your local network.
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.djsincla.overpass
        PRODUCT_NAME: Overpass
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
