# Overpass, the app. Generate the Xcode project with `xcodegen`.
#
# Everything that can be decided without a window lives in the Swift package at
# the repository root (IOptronKit, SkyKit) and is tested with `swift test`. This
# target is only the SwiftUI layer. It is an Xcode target, not a SwiftPM
# executable as in notebookMLX, because iOS needs a real app bundle.
name: Overpass
options:
  bundleIdPrefix: com.djsincla
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true

packages:
  OverpassKit:
    path: .

settings:
  base:
    DEVELOPMENT_TEAM: HG979YFABK
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    # The version: bump MARKETING_VERSION per release, CURRENT_PROJECT_VERSION per build
    # (packaging/release.sh reads them from here).
    MARKETING_VERSION: "0.4.4"
    CURRENT_PROJECT_VERSION: "13"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Overpass:
    type: application
    supportedDestinations: [iOS, macOS]
    sources: [App]
    dependencies:
      - package: OverpassKit
        product: SkyKit
      - package: OverpassKit
        product: IOptronKit
      - package: OverpassKit
        product: UVCControl
      # The iPad's driver for the mount's USB cable. Built here, embedded by the script below.
      - target: OverpassSerial
        embed: false
        platformFilters: [iOS]
    postBuildScripts:
      # Until Apple approves the DriverKit entitlements (request ASTD67BKC2), only development
      # builds carry the driver, so TestFlight builds still sign. Once approved, drop the Debug
      # condition here and for the entitlements below.
      - name: Embed the iPad USB driver (Debug)
        basedOnDependencyAnalysis: false
        script: |
          [ "$CONFIGURATION" = Debug ] && [ "$PLATFORM_NAME" = iphoneos ] || exit 0
          mkdir -p "$TARGET_BUILD_DIR/$WRAPPER_NAME/SystemExtensions"
          ditto "$BUILD_DIR/$CONFIGURATION-driverkit/OverpassSerial.dext" "$TARGET_BUILD_DIR/$WRAPPER_NAME/SystemExtensions/OverpassSerial.dext"
          # A page in the iPad's Settings, where the driver's switch appears. Without one,
          # iPadOS sometimes leaves the switch out.
          ditto "$SRCROOT/iOS/Settings.bundle" "$TARGET_BUILD_DIR/$WRAPPER_NAME/Settings.bundle"
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        "ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES[sdk=iphone*]": AppIconRed
        PRODUCT_BUNDLE_IDENTIFIER: com.djsincla.overpass
        # iPhone and iPad use the App ID registered for TestFlight. The Mac keeps its own, so its
        # sandbox (settings, alignment, TLEs) stays where it is.
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphoneos*]": com.dwaynesinclair.overpass
        "PRODUCT_BUNDLE_IDENTIFIER[sdk=iphonesimulator*]": com.dwaynesinclair.overpass
        PRODUCT_NAME: Overpass
        # Notarisation needs the hardened runtime for Developer ID builds.
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        # The embed script writes into the app bundle; declaring its outputs would leave empty
        # folders in Release builds, where it does nothing.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
      configs:
        Debug:
          "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": App/Overpass-iOS.entitlements

  # Runs the mount's Prolific USB adapter on an iPad (M1 or later), which has no serial ports.
  OverpassSerial:
    type: driver-extension
    platform: auto
    sources:
      - path: Driver
        excludes: [Info.plist, "*.entitlements"]
      - path: Sources/DriverLink/include/DriverLink.h
        buildPhase: none
    dependencies:
      - sdk: DriverKit.framework
      - sdk: USBDriverKit.framework
    settings:
      base:
        SDKROOT: driverkit
        DRIVERKIT_DEPLOYMENT_TARGET: "23.0"
        PRODUCT_BUNDLE_IDENTIFIER: com.dwaynesinclair.overpass.serial
        PRODUCT_NAME: OverpassSerial
        INFOPLIST_FILE: Driver/Info.plist
        CODE_SIGN_ENTITLEMENTS: Driver/OverpassSerial.entitlements
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_HARDENED_RUNTIME: NO
        SKIP_INSTALL: YES
